# Palo Alto PAN-OS style demo (no built-in adapter: used to show AI interpretation)
set deviceconfig system hostname PA-DEMO-01
set deviceconfig system login-banner "Authorized access only"
set deviceconfig system ntp-servers primary-ntp-server ntp-server-address 10.0.0.9
set deviceconfig system service disable-telnet yes
set deviceconfig system service disable-http no
set deviceconfig system service disable-ssh no
set mgt-config users admin phash $5$abcdEFGH$XyZ123456789
set shared log-settings syslog SYSLOG1 server SRV1 server 10.0.0.50
set deviceconfig system snmp-setting snmp-system access-setting version v2c snmp-community-string public
